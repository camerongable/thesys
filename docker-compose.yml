services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thesys}
      POSTGRES_USER: ${POSTGRES_USER:-thesys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thesys}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thesys} -d ${POSTGRES_DB:-thesys}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:0.67.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-dummy}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dummy}
    ports:
      - "4000:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro

  temporal:
    image: temporalio/auto-setup:1.25
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-thesys}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-thesys}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    command: >
      sh -ec "DATABASE_URL=$$MIGRATION_DATABASE_URL alembic upgrade head;
              unset MIGRATION_DATABASE_URL;
              exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_MODE: dev
      DATABASE_RUNTIME_ROLE: api
      DEV_AUTH_DEFAULT_EMAIL: ${DEV_AUTH_DEFAULT_EMAIL:-dev@thesys.local}
      DEV_AUTH_DEFAULT_NAME: ${DEV_AUTH_DEFAULT_NAME:-Dev User}
      DATABASE_URL: postgresql+psycopg://thesys_api:thesys-api-local@postgres:5432/thesys
      MIGRATION_DATABASE_URL: postgresql+psycopg://thesys_migration:thesys-migration-local@postgres:5432/thesys
      REDIS_URL: redis://redis:6379/0
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-local-dev}
      LITELLM_MODEL: ${LITELLM_MODEL:-dev-gpt-4o-mini}
      LITELLM_TIMEOUT_SECONDS: ${LITELLM_TIMEOUT_SECONDS:-180}
      LLM_STUB_MODE: ${LLM_STUB_MODE:-always}
      LLM_STRUCTURED_OUTPUT_REPAIR_ATTEMPTS: ${LLM_STRUCTURED_OUTPUT_REPAIR_ATTEMPTS:-1}
      LLM_FALLBACK_POLICY: ${LLM_FALLBACK_POLICY:-emergency}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-thesys-local}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
      S3_VERIFY_BUCKET_SECURITY: ${S3_VERIFY_BUCKET_SECURITY:-false}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      S3_PRESIGNED_URL_TTL_SECONDS: ${S3_PRESIGNED_URL_TTL_SECONDS:-300}
      S3_RETENTION_DAYS: ${S3_RETENTION_DAYS:-30}
      THESYS_ENCRYPTION_KEK_V1: ${THESYS_ENCRYPTION_KEK_V1:-MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=}
      OBJECT_STORAGE_MODE: ${OBJECT_STORAGE_MODE:-s3}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MALWARE_SCANNER_MODE: clamav
      MALWARE_SCANNER_HOST: clamav
      MALWARE_SCANNER_PORT: 3310
      URL_FETCH_TIMEOUT_SECONDS: ${URL_FETCH_TIMEOUT_SECONDS:-15}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-deterministic-hash-embedding-1536}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-v1}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_RETRY_ATTEMPTS: ${EMBEDDING_RETRY_ATTEMPTS:-1}
      AI_EMBEDDING_CACHE_ENABLED: ${AI_EMBEDDING_CACHE_ENABLED:-true}
      AI_RETRIEVAL_CACHE_ENABLED: ${AI_RETRIEVAL_CACHE_ENABLED:-true}
      AI_RERANK_CACHE_ENABLED: ${AI_RERANK_CACHE_ENABLED:-true}
      AI_SEMANTIC_ANSWER_CACHE_ENABLED: ${AI_SEMANTIC_ANSWER_CACHE_ENABLED:-false}
      AI_SEMANTIC_ANSWER_CACHE_LIVE_ENABLED: ${AI_SEMANTIC_ANSWER_CACHE_LIVE_ENABLED:-false}
      RETRIEVAL_VECTOR_PATH: ${RETRIEVAL_VECTOR_PATH:-auto}
      RETRIEVAL_PYTHON_FALLBACK_ENABLED: ${RETRIEVAL_PYTHON_FALLBACK_ENABLED:-true}
      RETRIEVAL_RERANKING_ENABLED: ${RETRIEVAL_RERANKING_ENABLED:-true}
      RETRIEVAL_RERANKER_PROVIDER: ${RETRIEVAL_RERANKER_PROVIDER:-deterministic}
      RETRIEVAL_CONTEXT_TOKEN_BUDGET: ${RETRIEVAL_CONTEXT_TOKEN_BUDGET:-3500}
      RETRIEVAL_MAX_CHUNKS_PER_SOURCE: ${RETRIEVAL_MAX_CHUNKS_PER_SOURCE:-2}
      RETRIEVAL_MIN_CONTEXT_SCORE: ${RETRIEVAL_MIN_CONTEXT_SCORE:-0.15}
      EXTERNAL_SEARCH_ENABLED: ${EXTERNAL_SEARCH_ENABLED:-false}
      EXTERNAL_SEARCH_PROVIDER: ${EXTERNAL_SEARCH_PROVIDER:-deterministic}
      EXTERNAL_SEARCH_MAX_RESULTS_PER_QUERY: ${EXTERNAL_SEARCH_MAX_RESULTS_PER_QUERY:-5}
      EXTERNAL_SEARCH_MAX_QUERIES_PER_SPRINT: ${EXTERNAL_SEARCH_MAX_QUERIES_PER_SPRINT:-6}
      EXTERNAL_SEARCH_TIMEOUT_SECONDS: ${EXTERNAL_SEARCH_TIMEOUT_SECONDS:-20}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MULTIMODAL_EXTRACTION_PROVIDER: ${MULTIMODAL_EXTRACTION_PROVIDER:-deterministic}
      MULTIMODAL_EXTRACTION_MODEL: ${MULTIMODAL_EXTRACTION_MODEL:-dev-gpt-4o-mini}
      MULTIMODAL_EXTRACTION_TIMEOUT_SECONDS: ${MULTIMODAL_EXTRACTION_TIMEOUT_SECONDS:-90}
      MULTIMODAL_PDF_FALLBACK_ENABLED: ${MULTIMODAL_PDF_FALLBACK_ENABLED:-false}
      MULTIMODAL_PDF_MIN_TEXT_CHARS: ${MULTIMODAL_PDF_MIN_TEXT_CHARS:-80}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-thesys-local}
      LANGSMITH_PUBLIC_URL_BASE: ${LANGSMITH_PUBLIC_URL_BASE:-https://smith.langchain.com}
      LANGSMITH_PROVIDER_RETENTION_DAYS: ${LANGSMITH_PROVIDER_RETENTION_DAYS:-14}
      OPA_POLICY_URL: http://opa:8181
      OPA_POLICY_TIMEOUT_SECONDS: ${OPA_POLICY_TIMEOUT_SECONDS:-2}
      OPA_POLICY_ENFORCEMENT_ENABLED: ${OPA_POLICY_ENFORCEMENT_ENABLED:-true}
      TEMPORAL_ENABLED: ${TEMPORAL_ENABLED:-true}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-thesys-research-sprints}
      TEMPORAL_WORKFLOW_TIMEOUT_SECONDS: ${TEMPORAL_WORKFLOW_TIMEOUT_SECONDS:-3600}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_started
      litellm:
        condition: service_started
      temporal:
        condition: service_started
      opa:
        condition: service_started

  temporal-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    command: python -m app.temporal.worker
    restart: unless-stopped
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_MODE: dev
      DATABASE_RUNTIME_ROLE: worker
      DEV_AUTH_DEFAULT_EMAIL: ${DEV_AUTH_DEFAULT_EMAIL:-dev@thesys.local}
      DEV_AUTH_DEFAULT_NAME: ${DEV_AUTH_DEFAULT_NAME:-Dev User}
      DATABASE_URL: postgresql+psycopg://thesys_worker:thesys-worker-local@postgres:5432/thesys
      REDIS_URL: redis://redis:6379/0
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-local-dev}
      LITELLM_MODEL: ${LITELLM_MODEL:-dev-gpt-4o-mini}
      LITELLM_TIMEOUT_SECONDS: ${LITELLM_TIMEOUT_SECONDS:-180}
      LLM_STUB_MODE: ${LLM_STUB_MODE:-always}
      LLM_STRUCTURED_OUTPUT_REPAIR_ATTEMPTS: ${LLM_STRUCTURED_OUTPUT_REPAIR_ATTEMPTS:-1}
      LLM_FALLBACK_POLICY: ${LLM_FALLBACK_POLICY:-emergency}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-thesys-local}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
      S3_VERIFY_BUCKET_SECURITY: ${S3_VERIFY_BUCKET_SECURITY:-false}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      S3_PRESIGNED_URL_TTL_SECONDS: ${S3_PRESIGNED_URL_TTL_SECONDS:-300}
      S3_RETENTION_DAYS: ${S3_RETENTION_DAYS:-30}
      OBJECT_STORAGE_MODE: ${OBJECT_STORAGE_MODE:-s3}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      URL_FETCH_TIMEOUT_SECONDS: ${URL_FETCH_TIMEOUT_SECONDS:-15}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-deterministic-hash-embedding-1536}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-v1}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_RETRY_ATTEMPTS: ${EMBEDDING_RETRY_ATTEMPTS:-1}
      AI_EMBEDDING_CACHE_ENABLED: ${AI_EMBEDDING_CACHE_ENABLED:-true}
      AI_RETRIEVAL_CACHE_ENABLED: ${AI_RETRIEVAL_CACHE_ENABLED:-true}
      AI_RERANK_CACHE_ENABLED: ${AI_RERANK_CACHE_ENABLED:-true}
      AI_SEMANTIC_ANSWER_CACHE_ENABLED: ${AI_SEMANTIC_ANSWER_CACHE_ENABLED:-false}
      AI_SEMANTIC_ANSWER_CACHE_LIVE_ENABLED: ${AI_SEMANTIC_ANSWER_CACHE_LIVE_ENABLED:-false}
      RETRIEVAL_VECTOR_PATH: ${RETRIEVAL_VECTOR_PATH:-auto}
      RETRIEVAL_PYTHON_FALLBACK_ENABLED: ${RETRIEVAL_PYTHON_FALLBACK_ENABLED:-true}
      RETRIEVAL_RERANKING_ENABLED: ${RETRIEVAL_RERANKING_ENABLED:-true}
      RETRIEVAL_RERANKER_PROVIDER: ${RETRIEVAL_RERANKER_PROVIDER:-deterministic}
      RETRIEVAL_CONTEXT_TOKEN_BUDGET: ${RETRIEVAL_CONTEXT_TOKEN_BUDGET:-3500}
      RETRIEVAL_MAX_CHUNKS_PER_SOURCE: ${RETRIEVAL_MAX_CHUNKS_PER_SOURCE:-2}
      RETRIEVAL_MIN_CONTEXT_SCORE: ${RETRIEVAL_MIN_CONTEXT_SCORE:-0.15}
      EXTERNAL_SEARCH_ENABLED: ${EXTERNAL_SEARCH_ENABLED:-false}
      EXTERNAL_SEARCH_PROVIDER: ${EXTERNAL_SEARCH_PROVIDER:-deterministic}
      EXTERNAL_SEARCH_MAX_RESULTS_PER_QUERY: ${EXTERNAL_SEARCH_MAX_RESULTS_PER_QUERY:-5}
      EXTERNAL_SEARCH_MAX_QUERIES_PER_SPRINT: ${EXTERNAL_SEARCH_MAX_QUERIES_PER_SPRINT:-6}
      EXTERNAL_SEARCH_TIMEOUT_SECONDS: ${EXTERNAL_SEARCH_TIMEOUT_SECONDS:-20}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MULTIMODAL_EXTRACTION_PROVIDER: ${MULTIMODAL_EXTRACTION_PROVIDER:-deterministic}
      MULTIMODAL_EXTRACTION_MODEL: ${MULTIMODAL_EXTRACTION_MODEL:-dev-gpt-4o-mini}
      MULTIMODAL_EXTRACTION_TIMEOUT_SECONDS: ${MULTIMODAL_EXTRACTION_TIMEOUT_SECONDS:-90}
      MULTIMODAL_PDF_FALLBACK_ENABLED: ${MULTIMODAL_PDF_FALLBACK_ENABLED:-false}
      MULTIMODAL_PDF_MIN_TEXT_CHARS: ${MULTIMODAL_PDF_MIN_TEXT_CHARS:-80}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-thesys-local}
      LANGSMITH_PUBLIC_URL_BASE: ${LANGSMITH_PUBLIC_URL_BASE:-https://smith.langchain.com}
      TEMPORAL_ENABLED: ${TEMPORAL_ENABLED:-true}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-thesys-research-sprints}
      TEMPORAL_WORKFLOW_TIMEOUT_SECONDS: ${TEMPORAL_WORKFLOW_TIMEOUT_SECONDS:-3600}
      LANGSMITH_PROVIDER_RETENTION_DAYS: ${LANGSMITH_PROVIDER_RETENTION_DAYS:-14}
      RETENTION_CLEANUP_SCHEDULE_ENABLED: ${RETENTION_CLEANUP_SCHEDULE_ENABLED:-true}
      RETENTION_CLEANUP_INTERVAL_HOURS: ${RETENTION_CLEANUP_INTERVAL_HOURS:-24}
      WORKFLOW_TIMEOUT_RECONCILIATION_SCHEDULE_ENABLED: ${WORKFLOW_TIMEOUT_RECONCILIATION_SCHEDULE_ENABLED:-true}
      WORKFLOW_TIMEOUT_RECONCILIATION_INTERVAL_MINUTES: ${WORKFLOW_TIMEOUT_RECONCILIATION_INTERVAL_MINUTES:-5}
      TEMPORAL_NAMESPACE_RETENTION_RECONCILE_ENABLED: ${TEMPORAL_NAMESPACE_RETENTION_RECONCILE_ENABLED:-true}
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      litellm:
        condition: service_started
      temporal:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    command: pnpm run dev --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - web_node_modules:/app/apps/web/node_modules
      - web_next_cache:/app/apps/web/.next
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
  web_next_cache:

name: Security

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  PROMPTFOO_DISABLE_UPDATE: "true"

jobs:
  python-security:
    name: Python security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.14"
      - run: uv sync --project apps/api --locked --all-extras
      - run: uv run --project apps/api ruff check app
      - run: uv run --project apps/api pytest app/tests/security
      - run: uvx --from bandit==1.8.6 bandit -q -r apps/api/app
      - run: uv export --project apps/api --locked --no-dev --output-file /tmp/api-requirements.txt
      - run: uvx --from pip-audit==2.9.0 pip-audit --strict -r /tmp/api-requirements.txt
      - run: uvx --from semgrep==1.130.0 semgrep scan --config auto --error apps/api/app

  web-security:
    name: Web security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter thesys-web test
      - run: pnpm --filter thesys-web typecheck
      - run: pnpm audit --audit-level=high

  promptfoo-fast:
    name: Promptfoo fast suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --locked --all-extras
      - run: pnpm security:redteam:fast

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  osv:
    name: OSV scan
    permissions:
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |
        --lockfile=apps/api/uv.lock
        --lockfile=pnpm-lock.yaml
      fail-on-vuln: true

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json

  nightly-security:
    name: Nightly security regression suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --locked --all-extras
      - name: Full red-team, tenant, PII, memory, and budget regressions
        run: uv run --project apps/api pytest app/tests/security
      - name: Full Promptfoo suite
        run: pnpm security:redteam:full
      - name: Configure Garak REST target
        env:
          GARAK_TARGET_URI: ${{ secrets.GARAK_TARGET_URI }}
          GARAK_TARGET_AUTHORIZATION: ${{ secrets.GARAK_TARGET_AUTHORIZATION }}
        run: |
          uv run --project apps/api python scripts/write_garak_rest_config.py \
            --target-uri "$GARAK_TARGET_URI" \
            --authorization "$GARAK_TARGET_AUTHORIZATION" \
            --output artifacts/garak-rest.json
      - name: Garak application endpoint scan
        run: |
          uvx --from garak==0.15.1 garak \
            --target_type rest \
            --generator_option_file artifacts/garak-rest.json \
            --probes promptinject,encoding \
            --generations 1 \
            --report_prefix artifacts/garak
      - name: Build API image for nightly scan
        run: docker build --file apps/api/Dockerfile --tag thesys-api:nightly-security .
      - name: Build web image for nightly scan
        run: docker build --file apps/web/Dockerfile --tag thesys-web:nightly-security .
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: thesys-api:nightly-security
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: thesys-web:nightly-security
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan Kubernetes configuration
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: infra/k8s/base
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
